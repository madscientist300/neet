<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Access comprehensive NEET Botany study materials, organized by class and chapter. Download PDFs for Class 11 and 12 botany topics including plant physiology, genetics, and more.">
  <meta name="keywords"
    content="NEET, Botany, Study Materials, Class 11, Class 12, Biology, Plant Science, PDF Downloads">

  <!-- Performance: Preload critical resources -->
  <link rel="preload" href="resources.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="styles.css" as="style">
  <link rel="preload" href="app.js" as="script">

  <title>NEET Botany Resources - Comprehensive Study Materials</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect rx="6" width="24" height="24" fill="#052032"></rect>
          <path d="M7 9h10M7 13h6" stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round"></path>
        </svg>
        <div>
          <h1>NEET Botany — Resource Hub</h1>
          <div class="subtitle">Organized by Class · Chapter · Topic · Tags</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="meta-info">Offline friendly · Free</div>
      </div>
    </header>

    <div class="controls">
      <!-- Custom Dropdown for Class Filter -->
      <div class="custom-select" id="classFilterWrapper">
        <div class="select-trigger" data-value="">
          <span class="select-text">All Classes</span>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 4L6 8L10 4" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div class="select-options">
          <div class="select-option" data-value="">All Classes</div>
        </div>
      </div>

      <!-- Custom Dropdown for Chapter Filter -->
      <div class="custom-select" id="chapterFilterWrapper">
        <div class="select-trigger" data-value="">
          <span class="select-text">All Chapters</span>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 4L6 8L10 4" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div class="select-options">
          <div class="select-option" data-value="">All Chapters</div>
        </div>
      </div>

      <!-- Custom Dropdown for Tag Filter -->
      <div class="custom-select" id="tagFilterWrapper">
        <div class="select-trigger" data-value="">
          <span class="select-text">All Concepts/Tags</span>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 4L6 8L10 4" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div class="select-options">
          <div class="select-option" data-value="">All Concepts/Tags</div>
        </div>
      </div>

      <input id="searchBox" type="search" placeholder="Search by keyword, concept, filename..."
        aria-label="Search resources">
      <button id="resetBtn" type="button">Reset</button>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="noresult" class="empty" style="display:none">No resources found. Try clearing filters.</div>

    <footer>Created with ❤️ by <strong>Sohan Kumar</strong></footer>
  </div>

  <!-- modal viewer -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1"></div>

  <!-- PDF.js -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3/build/pdf.min.js"></script>

  <!-- App script -->
  <script src="app.js"></script>
</body>

</html>
